[package]
name = "browser-mcp-server"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
anyhow = "1"
rmcp = { version = "3.0.0-beta.2", features = ["macros", "server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
