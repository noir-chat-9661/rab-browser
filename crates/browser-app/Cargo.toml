[package]
name = "browser-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
browser-core = { path = "../browser-core" }
browser-engine-wry = { path = "../browser-engine-wry" }
browser-mcp-server = { path = "../browser-mcp-server" }
tao = "0.37.0"
wry = { version = "0.56.1", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
url = "2"
muda = "0.19.3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["block2", "NSEvent"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Pinned to the same version wry 0.56.1 already pulls in (see Cargo.lock),
# so the HWND type returned by WebViewExtWindows::hwnd() matches exactly.
windows = { version = "0.61", default-features = false, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
