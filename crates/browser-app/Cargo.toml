[package]
name = "browser-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
browser-core = { path = "../browser-core" }
browser-engine-wry = { path = "../browser-engine-wry" }
tao = "0.35.3"
wry = { version = "0.55.1", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["block2", "NSEvent"] }
