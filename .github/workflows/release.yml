name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach build artifacts to (e.g. v0.1.0-beta.1)"
        required: true

permissions:
  contents: write

env:
  # Fail the build instead of silently embedding a placeholder chrome UI if
  # pnpm can't be found (see build.rs) — a release binary must never ship
  # with a broken UI undetected.
  RAB_REQUIRE_BASE_UI: "1"

jobs:
  macos:
    name: Build macOS .dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: base-ui/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: base-ui/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: ./scripts/build-app.sh
      - run: |
          version="$(sed -n '/^version = /{s/^version = "\(.*\)"/\1/p;q;}' crates/browser-app/Cargo.toml)"
          mv "target/release/rab-browser-${version}.dmg" "rab-browser-${{ inputs.tag }}.dmg"
      - run: |
          gh release upload "${{ inputs.tag }}" \
            "rab-browser-${{ inputs.tag }}.dmg" \
            --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}

  windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: base-ui/package.json
      # No cache: pnpm here — build.rs is the only pnpm caller (via PATH), so
      # by the time setup-node's post-job cache-save runs there's no store
      # for it to find, and it fails the job with a path-validation error.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release -p browser-app
      - run: |
          Copy-Item target/release/browser-app.exe "rab-browser-${{ inputs.tag }}.exe"
        shell: pwsh
      - run: |
          gh release upload "${{ inputs.tag }}" `
            "rab-browser-${{ inputs.tag }}.exe" `
            --clobber --repo "${{ github.repository }}"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}

  linux:
    name: Build Linux .AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: base-ui/package.json
      # No cache: pnpm here — see the windows job's comment on the same setup-node step.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev imagemagick
      - run: cargo build --release -p browser-app
      - name: Assemble AppDir
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin
          cp target/release/browser-app AppDir/usr/bin/rab-browser
          # No app icon has been designed yet (tracked separately); a plain
          # placeholder is required because appimagetool refuses to build
          # without one. Swap for a real .png once an icon exists.
          convert -size 256x256 xc:'#171816' AppDir/rab-browser.png
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=rab-browser' \
            'Exec=rab-browser' \
            'Icon=rab-browser' \
            'Categories=Network;WebBrowser;' \
            > AppDir/rab-browser.desktop
          printf '%s\n' \
            '#!/bin/sh' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'exec "$HERE/usr/bin/rab-browser" "$@"' \
            > AppDir/AppRun
          chmod +x AppDir/AppRun
      - run: |
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run AppDir \
            "rab-browser-${{ inputs.tag }}-x86_64.AppImage"
      - run: |
          gh release upload "${{ inputs.tag }}" \
            "rab-browser-${{ inputs.tag }}-x86_64.AppImage" \
            --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
